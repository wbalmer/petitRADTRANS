{#- Logo shown in the left sidebar, above the global table of contents. -#}

  <a href="{{ pathto(root_doc) }}">
    <img src="{{ pathto('_static/pRTv4Logov1.png', 1) }}" alt="{{ project }} logo" />

</div>

  </ul>
</div>
{%- endif -%}
