[build-system]
build-backend = 'mesonpy'
requires = [
    "meson-python>=0.12.1",
    "ninja>=1.8.2",
    "Cython>=0.29.35",
    "pybind11>=2.10.4",
    "numpy>=2.0",
    "jax"
]

[project]
name = "petitRADTRANS"
version = "4.0.0a16"
description = "Exopanet spectral synthesis tool for retrievals"
authors = [
    {name = "Paul Mollière", email = "molliere@mpia.de"},
]
readme = "README.rst"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "meson-python",
    "ninja",
    "numpy>2.0",
    "jax>0.8",
    "scipy",
    "astropy>=7.0",  # introduces the CAHA observing site
    "molmass",
    "h5py",
    "dill",
    "jaxns",
    "pyvo",
    "bs4",
    "selenium",
    "exo_k",
    "interpax",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "corner",
    "pooch"
]

[project.urls]
Documentation = "https://petitradtrans.readthedocs.io/en/latest/"
Repository = "https://gitlab.com/mauricemolli/petitRADTRANS"
Issues = "https://gitlab.com/mauricemolli/petitRADTRANS/-/issues"
Changelog = "https://gitlab.com/mauricemolli/petitRADTRANS/-/blob/master/CHANGELOG.md"

[project.optional-dependencies]

full = [
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "corner",
    "seaborn",  # only used in nice_corner
    "ultranest",
    "pymultinest",
    "blackjax",
    "numpyro",
    "equinox>=0.11",
    "optax>=0.2",
    "zarr>=2.18",
    "numcodecs>=0.13",
    "orbax-checkpoint>=0.6",
    "distrax>=0.1.5"
]

retrieval = [
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "corner",
    "ultranest",
    "pymultinest",
    "blackjax",
    "numpyro",
]

sbi = [
    "equinox>=0.11",
    "optax>=0.2",
    "zarr>=2.18",
    "numcodecs>=0.13",
    "orbax-checkpoint>=0.6",
    "distrax>=0.1.5"
]

test = [
    "build",
    "wheel",
    "pytest",
    "pytest-cov",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "corner",
    "seaborn",
    "ultranest",
    "pymultinest",
    "blackjax",
    "numpyro",
    "equinox>=0.11",
    "optax>=0.2",
    "zarr>=2.18",
    "numcodecs>=0.13"
]

[tool.flake8]
max-line-length = 120

[tool.pytest]
norecursedirs = [
    ".tox",
    "build",
    "docs",
    "petitRADTRANS",
    "testing",
    "scripts"
]

