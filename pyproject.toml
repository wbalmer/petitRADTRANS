[build-system]
build-backend = 'mesonpy'
requires = [
    "meson-python>=0.19.0",
    "numpy>2.0",
    # jaxlib ships the XLA FFI headers needed to build the native
    # correlated-k mixing kernel (petitRADTRANS/cpp_src).
    "jax>=0.10.0",
]

[project]
name = "petitRADTRANS"
# The version is read by meson from VERSION.txt.
dynamic = ["version"]
requires-python = ">=3.12"
description = "Exopanet spectral synthesis tool for retrievals"
authors = [
    {name = "Paul Mollière", email = "molliere@mpia.de"},
]
readme = "README.rst"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = [
    "meson-python>=0.19.0",
    "ninja",
    "numpy>2.0",
    "jax>=0.10.0",
    "scipy",
    "astropy>=7.0",
    "molmass",
    "h5py",
    "dill",
    "pyvo",
    "bs4",
    "selenium",
    "interpax>=0.3.14",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "corner",
    "pooch",
    "filelock"
]

[project.urls]
Documentation = "https://petitradtrans.readthedocs.io/en/latest/"
Repository = "https://gitlab.com/mauricemolli/petitRADTRANS"
Issues = "https://gitlab.com/mauricemolli/petitRADTRANS/-/issues"
Changelog = "https://gitlab.com/mauricemolli/petitRADTRANS/-/blob/master/CHANGELOG.md"

[project.optional-dependencies]

full = [
    "cython",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "arviz",
    "corner",
    "tfp-nightly",
    "jaxns>=3.0.0",
    "dynesty>=3.0.0",
    "nautilus-sampler>=1.0.5",
    "pymultinest",
    "blackjax>=1.7",
    "numpyro>=0.21.0",
    "optax>=0.2.8",
    "ultranest",
]

retrieval = [
    "cython",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "arviz",
    "corner",
    # petitRADTRANS.retrieval imports TensorFlow Probability's JAX substrate at
    # import time. Only the nightly works with current JAX: the stable
    # tensorflow-probability 0.25 fails to import against JAX >= 0.12. Do not
    # install both; they provide the same `tensorflow_probability` package.
    "tfp-nightly",
    # NOTE: JAXNS still reports 3.0.0 for post-release API changes pRT
    # depends on (jaxns.depth_condition replacing jaxns.termination_condition),
    # so this bound is a floor only. require_jaxns() probes the real API.
    "jaxns>=3.0.0",
    "dynesty>=3.0.0",
    "nautilus-sampler>=1.0.5",
    "pymultinest",
    "blackjax>=1.7",
    "numpyro>=0.21.0",
    "optax>=0.2.8",
    "ultranest",
]

test = [
    "build",
    "wheel",
    "pytest",
    "pytest-cov",
    "mpi4py",
    "requests",
    "skycalc-cli",
    "matplotlib",
    "arviz",
    "corner",
    "tfp-nightly",
    "jaxns>=3.0.0",
    "dynesty>=3.0.0",
    "nautilus-sampler>=1.0.5",
    "pymultinest",
    "blackjax>=1.7",
    "numpyro>=0.21.0",
    "optax>=0.2.8",
    "ultranest",
]

[tool.flake8]
max-line-length = 120

[tool.pytest]
norecursedirs = [
    ".tox",
    "build",
    "docs",
    "petitRADTRANS",
    "testing",
    "scripts"
]

#[tool.tox]  # TODO add when tox fully supports toml, for now setup is in setup.cfg
#legacy_tox_ini = """"""
