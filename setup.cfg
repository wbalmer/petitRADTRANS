[build_ext]
inplace=1

[tox:tox]
# One test environment per supported Python version, plus flake8; run a single
# one with e.g. `tox -e py313`. tox-uv creates the environments with uv, which
# downloads any interpreter that is not installed, so the whole matrix runs on
# a machine (or CI image) that has only one Python.
envlist = py{312,313,314,315},flake8
requires = tox-uv>=1.37

[testenv]
# tox builds a petitRADTRANS wheel for each Python version in an isolated build
# environment and installs it with the test extra (all sampler backends). Build
# isolation is needed here: without it, every dependency that has no wheel for
# the Python under test (e.g. h5py, dm-tree or ultranest) would also be built
# inside the test environment, which lacks their build requirements.
package = wheel
extras = test
# exo_k: optional, used by some opacity conversions
deps =
    exo_k

# Run the tests and coverage on the installed package; extra arguments select
# tests, e.g. `tox -e py315 -- tests/test_samplers_package.py`.
commands =
    pytest {posargs:tests} --cov={envsitepackagesdir}/petitRADTRANS --cov-report=term-missing

# Pass Gitlab's 'CI' environment variable, DYLD_LIBRARY_PATH for MultiNest on macOS
# (tox already passes LD_LIBRARY_PATH and HOME), and HDF5_* for building h5py from
# source where it has no wheels.
passenv =
    CI
    DYLD_LIBRARY_PATH
    HDF5_*

[testenv:flake8]
commands = flake8 petitRADTRANS/
deps =
    flake8
skip_install = true

[coverage:run]
# Omit all modules starting with '_'
omit =
    */_*

[coverage:report]
omit =
    */_*

[flake8]
max-line-length = 120
# E203 (whitespace before ':') conflicts with black's slice formatting.
extend-ignore = E203
# Stray, untracked development scratch file in the package root.
extend-exclude = petitRADTRANS/test_cloud_core.py
# Per-file exemptions for intentional, load-order-sensitive patterns:
#  - math.py: jaxtyping forward annotations are not plain-Python expressions (F722).
#  - correlated_k_binning.py: jax.config.update must sit between `import jax` and
#    `import jax.numpy` (E402); long URLs live in the vendored exo_k docstring (E501).
#  - file_conversion.py: the _MissingFortranExtension shim must precede dependent imports (E402).
#  - multichain.py: a deliberately import-light worker section, documented in-file (E402).
per-file-ignores =
    petitRADTRANS/math.py:F722
    petitRADTRANS/opacities/correlated_k_binning.py:E402,E501
    petitRADTRANS/opacities/file_conversion.py:E402
    petitRADTRANS/retrieval/multichain.py:E402

[tool:pytest]
norecursedirs =
    .tox
    build
    docs
    petitRADTRANS
    scripts
