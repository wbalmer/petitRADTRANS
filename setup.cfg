[build_ext]
inplace=1

[tox:tox]
# py is the default test environment ([testenv])
envlist = {py},flake8
isolated_build = True
skipsdist = True

[testenv]
# Install petitRADTRANS in tox venv, use `--no-build-isolation` for the meson install to work
# Then run tests and coverage on the installed package
# Pass Gitlab's 'CI' environment variable
passenv =
    CI

commands =
    python -I -m pip install --no-build-isolation . -U -vvv
    pytest tests --cov={envsitepackagesdir}/petitRADTRANS --cov-report=term-missing

deps =
    meson-python
    ninja
    pytest
    pytest-cov
    numpy
    jax
    scipy
    astropy
    molmass
    h5py
    pymultinest
    pyvo
    exo_k
    equinox>=0.11
    optax>=0.2
    zarr>=2.18
    numcodecs>=0.13

[testenv:flake8]
commands = flake8 petitRADTRANS/
deps =
    flake8
skip_install = true

[coverage:run]
# Omit all modules starting with '_'
omit =
    */_*

[coverage:report]
omit =
    */_*

[flake8]
max-line-length = 120
# E203 (whitespace before ':') conflicts with black's slice formatting.
extend-ignore = E203
# Stray, untracked development scratch file in the package root.
extend-exclude = petitRADTRANS/test_cloud_core.py
# Per-file exemptions for intentional, load-order-sensitive patterns:
#  - math.py: jaxtyping forward annotations are not plain-Python expressions (F722).
#  - correlated_k_binning.py: jax.config.update must sit between `import jax` and
#    `import jax.numpy` (E402); long URLs live in the vendored exo_k docstring (E501).
#  - file_conversion.py: the _MissingFortranExtension shim must precede dependent imports (E402).
#  - multichain.py: a deliberately import-light worker section, documented in-file (E402).
per-file-ignores =
    petitRADTRANS/math.py:F722
    petitRADTRANS/opacities/correlated_k_binning.py:E402,E501
    petitRADTRANS/opacities/file_conversion.py:E402
    petitRADTRANS/retrieval/multichain.py:E402

[tool:pytest]
norecursedirs =
    .tox
    build
    docs
    petitRADTRANS
    scripts
